<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Megat Irfan Zackry — Software Engineer</title>
<meta name="description" content="Portfolio of Megat Irfan Zackry — Software Engineer, System Architect, Automation Developer." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg:#FFFFFF;
    --surface:#F6F5F1;
    --surface-2:#F0EEE7;
    --border:#E3E1D8;
    --text:#15171C;
    --text-muted:#686C74;
    --accent:#0F6B52;
    --accent-soft:#E3F1EC;

    --display:'Space Grotesk', var(--sans);
    --sans:'Inter', system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  img,svg{ display:block; max-width:100%; }

  a{ color:inherit; }

  :focus-visible{
    outline:2px solid var(--accent);
    outline-offset:3px;
  }

  .sr-only{
    position:absolute; width:1px; height:1px;
    padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  main{ max-width:920px; margin:0 auto; padding:0 1.25rem; }

  .hero{ padding:3rem 0 2.75rem; }
  .hero-inner{
    display:flex;
    gap:1rem;
    align-items:stretch;
    max-width:760px;
  }
  .hero-text{
    display:flex;
    flex-direction:column;
    gap:.55rem;
    min-width:0;
    flex:1 1 auto;
  }

  h1.line{ margin:0; font-family:var(--display); line-height:1.25; }
  h1.intro{
    font-size:clamp(1rem, 2.6vw, 1.2rem);
    font-weight:500;
    color:var(--text-muted);
  }
  h1.name{
    font-size:clamp(1.05rem, 3.8vw, 1.5rem);
    font-weight:600;
    color:var(--text);
    letter-spacing:-0.02em;
  }
  h1.role{
    font-size:clamp(1.6rem, 6.6vw, 2.75rem);
    font-weight:700;
    color:var(--text);
  }
  .role-word{ color:var(--accent); }
  .cursor{
    display:inline-block;
    width:.5ch;
    margin-left:2px;
    background:var(--accent);
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .skills{ margin:0 auto; max-width:1180px; padding:0 0 3.5rem; }
  .section-title{
    display:flex;
    align-items:center;
    gap:.55rem;
    font-family:var(--display);
    font-size:1.05rem;
    font-weight:600;
    color:var(--text);
    margin:0 0 1.1rem;
    padding-left:1.25rem;
  }
  .section-title .tick{
    width:7px; height:7px; border-radius:2px;
    background:var(--accent);
    flex-shrink:0;
  }

  .marquee{
    position:relative;
    overflow:hidden;
    mask-image:linear-gradient(90deg, transparent 0, #000 5%, #000 95%, transparent 100%);
    -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 5%, #000 95%, transparent 100%);
  }
  .marquee-track{
    display:flex;
    width:max-content;
    gap:.75rem;
    padding:.25rem 1.25rem;
    animation:scroll 55s linear infinite;
  }
  .marquee:hover .marquee-track{ animation-play-state:paused; }
  @keyframes scroll{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
  }

  .skill-card{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:.6rem;
    width:150px;
    height:66px;
    padding:0 .8rem;
    background:#FFFFFF;
    border:1px solid var(--border);
    border-radius:10px;
    box-shadow:0 1px 2px rgba(20,20,15,.04);
  }
  .skill-card .icon-chip{
    flex:0 0 auto;
    width:34px;
    height:34px;
    border-radius:7px;
    background:var(--surface-2);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .skill-card .icon-chip img{ width:22px; height:22px; object-fit:contain; }
  .skill-card .skill-name{
    flex:1 1 auto;
    min-width:0;
    font-family:var(--sans);
    font-size:.78rem;
    font-weight:600;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .site-footer{
    background:var(--surface);
    border-top:1px solid var(--border);
    padding:2.75rem 1.25rem 2rem;
  }
  .footer-inner{
    max-width:640px;
    margin:0 auto;
    text-align:center;
  }
  .footer-name{
    font-family:var(--display);
    font-size:1.15rem;
    font-weight:700;
    margin:0 0 .3rem;
  }
  .footer-tag{
    font-size:.85rem;
    color:var(--text-muted);
    margin:0 0 1.5rem;
  }
  .social-list{
    list-style:none;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:.6rem;
    margin:0 0 1.75rem;
    padding:0;
  }
  .social-list a{
    display:flex;
    align-items:center;
    justify-content:center;
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid var(--border);
    background:#FFFFFF;
    color:var(--text-muted);
    text-decoration:none;
    transition:color .15s ease, background-color .15s ease, border-color .15s ease;
  }
  .social-list a:hover,
  .social-list a:focus-visible{
    color:var(--accent);
    background:var(--accent-soft);
    border-color:var(--accent);
  }
  .social-list svg{ width:19px; height:19px; }

  .footer-copy{
    font-size:.78rem;
    color:var(--text-muted);
    margin:0;
  }

  @media (min-width:640px){
    .hero{ padding:4rem 0 3.25rem; }
    .skill-card{ width:172px; height:76px; }
    .skill-card .icon-chip{ width:40px; height:40px; }
    .skill-card .icon-chip img{ width:26px; height:26px; }
    .skill-card .skill-name{ font-size:.85rem; }
  }

  @media (min-width:1024px){
    .skill-card{ width:196px; height:84px; }
    .skill-card .icon-chip{ width:46px; height:46px; }
    .skill-card .icon-chip img{ width:30px; height:30px; }
  }

  @media (prefers-reduced-motion:reduce){
    .marquee-track{ animation:none; }
    .cursor{ animation:none; opacity:1; }
  }
</style>
</head>
<body>

<main>
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-text">
        <h1 class="line intro">Welcome recruiters,</h1>
        <h1 class="line name">My name is Megat Irfan Zackry Bin Ismail</h1>
        <h1 class="line role">I am a <span id="typed" class="role-word"></span><span class="cursor" aria-hidden="true">&nbsp;</span></h1>
      </div>
    </div>
  </header>

  <section class="skills">
    <h2 class="section-title"><span class="tick" aria-hidden="true"></span>Tech Stack</h2>

    <ul class="sr-only" id="skillsList"></ul>

    <div class="marquee" aria-hidden="true">
      <div class="marquee-track" id="marqueeTrack"></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <p class="footer-name">Megat Irfan Zackry</p>
    <p class="footer-tag">Software Engineer · System Architect · Automation Developer</p>
    <ul class="social-list" id="socialList" role="list"></ul>
    <p class="footer-copy">© 2026 Megat Irfan Zackry. All rights reserved.</p>
  </div>
</footer>

<script>
  (function(){
    const roles = ["Software Engineer", "System Architect", "Automation Developer"];
    const el = document.getElementById('typed');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (reduceMotion) {
      let i = 0;
      el.textContent = roles[0];
      setInterval(() => {
        i = (i + 1) % roles.length;
        el.textContent = roles[i];
      }, 2200);
      return;
    }

    let roleIndex = 0, charIndex = 0, deleting = false;
    const TYPE_MS = 75, DELETE_MS = 40, HOLD_MS = 1400, GAP_MS = 400;

    function tick(){
      const word = roles[roleIndex];

      if (!deleting) {
        charIndex++;
        el.textContent = word.slice(0, charIndex);
        if (charIndex === word.length) {
          deleting = true;
          return setTimeout(tick, HOLD_MS);
        }
        return setTimeout(tick, TYPE_MS);
      } else {
        charIndex--;
        el.textContent = word.slice(0, charIndex);
        if (charIndex === 0) {
          deleting = false;
          roleIndex = (roleIndex + 1) % roles.length;
          return setTimeout(tick, GAP_MS);
        }
        return setTimeout(tick, DELETE_MS);
      }
    }
    setTimeout(tick, TYPE_MS);
  })();

  (function(){
    const DEVICON = (slug, variant) => `https://raw.githubusercontent.com/devicons/devicon/master/icons/${slug}/${slug}-${variant}.svg`;
    const SIMPLE = (slug) => `https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/${slug}.svg`;

    const skills = [
      { name:'C#', src:DEVICON('csharp','original') },
      { name:'C++', src:DEVICON('cplusplus','original') },
      { name:'CSS', src:DEVICON('css3','original') },
      { name:'PHP', src:DEVICON('php','original') },
      { name:'HTML', src:DEVICON('html5','original') },
      { name:'React', src:DEVICON('react','original') },
      { name:'Dart', src:DEVICON('dart','original') },
      { name:'PowerShell', src:DEVICON('powershell','original') },
      { name:'Python', src:DEVICON('python','original') },
      { name:'SQL', src:DEVICON('mysql','original') },
      { name:'Java', src:DEVICON('java','original') },
      { name:'jQuery', src:DEVICON('jquery','original') },
      { name:'JavaScript', src:DEVICON('javascript','original') },
      { name:'TypeScript', src:DEVICON('typescript','original') },
      { name:'ASP.NET', src:DEVICON('dotnetcore','original') },
      { name:'Node.js', src:DEVICON('nodejs','original') },
      { name:'Flutter', src:DEVICON('flutter','original') },
      { name:'Django', src:DEVICON('django','plain') },
      { name:'Next.js', src:DEVICON('nextjs','original') },
      { name:'Spring Boot', src:SIMPLE('springboot') },
      { name:'AWS', src:DEVICON('amazonwebservices','original-wordmark') },
      { name:'Anaconda', src:DEVICON('anaconda','original') },
      { name:'Android Studio', src:DEVICON('androidstudio','original') },
      { name:'Burp Suite', src:SIMPLE('burpsuite') },
      { name:'Enterprise Architect', src:null, glyph:'ea' },
      { name:'Github Actions', src:SIMPLE('github') },
      { name:'Google Apps Script', src:SIMPLE('googleappsscript') },
      { name:'Jupyter Notebook', src:DEVICON('jupyter','original') },
      { name:'Power Platform', src:null, glyph:'pp' },
      { name:'VirtualBox', src:SIMPLE('virtualbox') },
      { name:'VS Code', src:DEVICON('vscode','original') },
      { name:'VBA', src:DEVICON('visualbasic','original') },
    ];

    const glyphs = {
      ea:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#15171C" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="8.5" y="14" width="7" height="7" rx="1"/><path d="M6.5 10v3a1 1 0 0 0 1 1H10M17.5 10v3a1 1 0 0 0-1 1h-2"/></svg>',
      pp:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#15171C" stroke-width="1.6"><circle cx="5" cy="12" r="2.3"/><circle cx="19" cy="5" r="2.3"/><circle cx="19" cy="19" r="2.3"/><path d="M7 11l10-4.5M7 13l10 4.5"/></svg>',
    };

    const listEl = document.getElementById('skillsList');
    listEl.innerHTML = skills.map(s => `<li>${s.name}</li>`).join('');

    function cardHTML(s){
      const inner = s.src
        ? `<img src="${s.src}" alt="" loading="lazy" />`
        : glyphs[s.glyph];
      return `<div class="skill-card">
        <span class="icon-chip">${inner}</span>
        <span class="skill-name">${s.name}</span>
      </div>`;
    }

    const track = document.getElementById('marqueeTrack');
    const html = skills.map(cardHTML).join('');
    track.innerHTML = html + html;
  })();

  (function(){
    const icons = {
      github:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>',
      linkedin:'<svg viewBox="0 0 128 128" fill="currentColor"><path d="M116 3H12a8.91 8.91 0 00-9 8.8v104.42a8.91 8.91 0 009 8.78h104a8.93 8.93 0 009-8.81V11.77A8.93 8.93 0 00116 3zM39.17 107H21.06V48.73h18.11zm-9-66.21a10.5 10.5 0 1110.49-10.5 10.5 10.5 0 01-10.54 10.48zM107 107H88.89V78.65c0-6.75-.12-15.44-9.41-15.44s-10.87 7.36-10.87 15V107H50.53V48.73h17.36v8h.24c2.42-4.58 8.32-9.41 17.13-9.41C103.6 47.28 107 59.35 107 75z"/></svg>',
      whatsapp:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>',
      telegram:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>',
      x:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.234 10.162 22.977 0h-2.072l-7.591 8.824L7.251 0H.258l9.168 13.343L.258 24H2.33l8.016-9.318L16.749 24h6.993zm-2.837 3.299-.929-1.329L3.076 1.56h3.182l5.965 8.532.929 1.329 7.754 11.09h-3.182z"/></svg>',
      threads:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.263 11.097c-.03-3.486-1.92-5.586-5.111-5.586-2.13 0-3.922.963-4.863 2.499l2.062 1.438c.535-.843 1.272-1.543 2.628-1.543 1.528 0 2.318.85 2.544 2.431a15 15 0 0 0-2.236-.173c-4.125 0-6.068 1.867-6.068 4.336s1.943 3.99 4.804 3.99c3.139 0 5.013-2.115 5.781-4.735.798.361 1.348 1.204 1.348 2.47 0 3.387-3.907 5.232-7.22 5.232-4.885 0-8.077-3.207-8.077-8.424 0-6.392 4.223-10.487 9.9-10.487 3.808 0 5.69 1.671 6.97 3.914l2.108-1.475C21.44 2.078 18.331 0 13.663 0 6.227 0 1.168 5.277 1.168 12.934c0 7 4.953 11.066 10.856 11.066 4.878 0 9.809-2.846 9.809-7.716 0-2.545-1.46-4.231-3.569-5.187m-6.33 4.855c-1.077 0-2.026-.512-2.026-1.453 0-1.483 1.822-1.934 3.606-1.934.678 0 1.34.045 1.927.173-.422 1.927-1.671 3.215-3.508 3.214Z"/></svg>',
      tiktok:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>',
      email:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5 12 13l8.5-6.5"/></svg>',
    };

    const links = [
      { label:'GitHub', href:'https://github.com/megatzackry', icon:'github' },
      { label:'LinkedIn', href:'https://www.linkedin.com/in/megatz/', icon:'linkedin' },
      { label:'WhatsApp', href:'https://api.whatsapp.com/send/?phone=601111934097', icon:'whatsapp' },
      { label:'Telegram', href:'https://telegram.me/megatz', icon:'telegram' },
      { label:'X (Twitter)', href:'https://x.com/megatzackry', icon:'x' },
      { label:'Threads', href:'https://www.threads.com/@megatzackry', icon:'threads' },
      { label:'TikTok', href:'https://www.tiktok.com/@megatzackry', icon:'tiktok' },
      { label:'Email', href:'mailto:megatirfanzackry@gmail.com', icon:'email' },
    ];

    const list = document.getElementById('socialList');
    list.innerHTML = links.map(l => {
      const isMail = l.href.startsWith('mailto:');
      const attrs = isMail ? '' : ' target="_blank" rel="noopener noreferrer"';
      return `<li><a href="${l.href}" aria-label="${l.label}"${attrs}>${icons[l.icon]}</a></li>`;
    }).join('');
  })();
</script>

</body>
</html>
